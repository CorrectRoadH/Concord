name: Native

on:
  workflow_dispatch:

concurrency:
  group: concord-native-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.os }}-${{ matrix.target }}
          deployment-target: ${{ matrix.target == 'darwin-arm64' && '15.0' || 'none' }}
      - name: Build from pinned sources and verify portability
        run: node scripts/build-native.ts --output native-artifacts --require-portable
      - name: Archive the validated target
        env:
          NATIVE_TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: '1'
        run: tar -czf "concord-native-$NATIVE_TARGET.tar.gz" -C native-artifacts "$NATIVE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            concord-native-${{ matrix.target }}.tar.gz
            native-artifacts/${{ matrix.target }}/artifact.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: native
    timeout-minutes: 3
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
      - name: Publish immutable artifacts for this source digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_COMMIT: ${{ github.sha }}
        run: |
          jq -s -e 'length == 2 and (map(.sourceDigest) | unique | length == 1) and (map(.cargoLockDigest) | unique | length == 1) and all(.portable and (.testHooks | not))' native-artifacts/*/artifact.json
          digest="$(jq -r .sourceDigest native-artifacts/linux-x64-glibc/artifact.json)"
          tag="native-${digest:0:16}"
          sha256sum concord-native-*.tar.gz > SHA256SUMS
          if gh api "repos/$GH_REPO/releases/tags/$tag" > existing-release.json 2>/dev/null; then
            for archive in concord-native-*.tar.gz; do
              archive_digest="$(sha256sum "$archive" | cut -d' ' -f1)"
              jq -e --arg name "$archive" --arg digest "sha256:$archive_digest" '.assets | any(.name == $name and .digest == $digest)' existing-release.json
            done
            exit 0
          fi
          gh release create "$tag" concord-native-*.tar.gz SHA256SUMS --target "$NATIVE_COMMIT" --prerelease --latest=false \
            --title "Concord native $digest" --notes "Pinned native artifacts for source digest $digest."
