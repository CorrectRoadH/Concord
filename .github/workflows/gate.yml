name: Gate
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  prepare-native:
    timeout-minutes: 15
    runs-on: instabox-medium
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: identity
        run: node scripts/ci-native-cache.ts
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ${{ steps.identity.outputs.directory }}
          key: ${{ steps.identity.outputs.key }}
      - name: Prepare pinned production and fault-injection binaries
        run: node scripts/prepare-native.ts --all-modes --output "$RUNNER_TEMP/gate-native"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.identity.outputs.directory }}
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: gate-native
          path: ${{ runner.temp }}/gate-native/
          if-no-files-found: error
          retention-days: 1

  gate:
    needs: prepare-native
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/16', '2/16', '3/16', '4/16', '5/16', '6/16', '7/16', '8/16', '9/16', '10/16', '11/16', '12/16', '13/16', '14/16', '15/16', '16/16', package]
    runs-on: instabox-medium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-native.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - name: Prepare the pinned offline pytest adapter
        run: uv run --no-project --with pytest==9.1.1 pytest --version
      - run: sudo apt-get update && sudo apt-get install -y ripgrep patchelf binutils
      - run: pnpm exec vp exec playwright install --with-deps chromium
        if: matrix.shard != 'package'
      - uses: actions/download-artifact@v4
        with:
          name: gate-native
          path: ${{ runner.temp }}/gate-native
      - name: Validate and install both native modes
        run: |
          node scripts/prepare-native.ts --prebuilt "$RUNNER_TEMP/gate-native"
          node scripts/prepare-native.ts --test-hooks --prebuilt "$RUNNER_TEMP/gate-native/test-hooks"
      - name: Run the complete gate for this shard
        run: pnpm gate --test-shard=${{ matrix.shard }}
      - name: Preserve test failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ strategy.job-index }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  native-hooks:
    needs: prepare-native
    timeout-minutes: 15
    runs-on: instabox-medium
    env:
      CONCORD_NATIVE_TEST_HOOKS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-native.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/download-artifact@v4
        with:
          name: gate-native
          path: ${{ runner.temp }}/gate-native
      - name: Install both binaries for fault-injection verification
        run: |
          node scripts/prepare-native.ts --prebuilt "$RUNNER_TEMP/gate-native"
          node scripts/prepare-native.ts --test-hooks --prebuilt "$RUNNER_TEMP/gate-native/test-hooks"
      - name: Verify native transaction failure and crash recovery
        run: pnpm gate test/process/hawdb-native.test.ts
      - name: Preserve fault-injection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-native-hooks
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
