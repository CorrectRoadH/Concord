name: Gate
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  gate:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8', package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - name: Prepare the pinned offline pytest adapter
        run: uv run --no-project --with pytest==9.1.1 pytest --version
      - uses: ./.github/actions/setup-native
        with:
          platform: ubuntu-24.04-linux-x64-glibc
      - name: Verify native transaction failure and crash recovery
        if: matrix.shard == '1/8'
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/hawdb-hooks-cache"
          export CONCORD_NATIVE_TEST_HOOKS=1
          node scripts/build-native.ts --test-hooks
          node --test test/process/hawdb-native.test.ts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep patchelf binutils
      - run: pnpm exec vp exec playwright install --with-deps chromium
      - run: pnpm exec vp run build:native
      - name: Run the complete gate for this shard
        run: pnpm gate --test-shard=${{ matrix.shard }}
      - name: Preserve test failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ strategy.job-index }}
          path: .test-results/
          if-no-files-found: ignore
          retention-days: 7
