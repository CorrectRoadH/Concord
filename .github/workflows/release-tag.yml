name: Dispatch tagged release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'concord-v*'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Run release on the shared default-branch cache scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(concord-)?v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh workflow run release.yml --ref "$RELEASE_BRANCH" --field "tag=$RELEASE_TAG"
