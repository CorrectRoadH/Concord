name: Tests
on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  prepare-native:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: identity
        run: bun scripts/ci-native-cache.ts
      - uses: actions/cache/restore@v6.1.0
        id: native-cache
        with:
          path: ${{ steps.identity.outputs.directory }}
          key: ${{ steps.identity.outputs.key }}
      - name: Prepare pinned official binaries
        run: bun scripts/prepare-native.ts --output "$RUNNER_TEMP/test-native"
      - uses: actions/cache/save@v6.1.0
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.identity.outputs.directory }}
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: test-native
          path: ${{ runner.temp }}/test-native/
          if-no-files-found: error
          retention-days: 1

  static:
    needs: prepare-native
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-native.outputs.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run typecheck:test
      - run: bun run typecheck:scripts
      - run: bun run typecheck:web
      - run: bun run lint
      - uses: actions/download-artifact@v8.0.2
        with:
          name: test-native
          path: ${{ runner.temp }}/test-native
      - name: Validate and install official native artifact
        run: bun scripts/prepare-native.ts --prebuilt "$RUNNER_TEMP/test-native"
      - run: bun run concord --json --dry-run check

  test:
    needs: prepare-native
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/16', '2/16', '3/16', '4/16', '5/16', '6/16', '7/16', '8/16', '9/16', '10/16', '11/16', '12/16', '13/16', '14/16', '15/16', '16/16']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-native.outputs.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
      - name: Prepare the pinned offline pytest adapter
        run: uv run --no-project --with pytest==9.2.0 pytest --version
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/download-artifact@v8.0.2
        with:
          name: test-native
          path: ${{ runner.temp }}/test-native
      - name: Validate and install official native artifact
        run: |
          bun scripts/prepare-native.ts --prebuilt "$RUNNER_TEMP/test-native"
      - name: Run Bun tests for this shard
        run: |
          mkdir -p .test-results
          bun run test --parallel=2 --shard=${{ matrix.shard }} --reporter=junit --reporter-outfile=.test-results/junit.xml --timings=.test-results/timings.json --update-timings
      - name: Preserve test failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-${{ strategy.job-index }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  darwin:
    needs: prepare-native
    timeout-minutes: 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare-native.outputs.sha }}
      - name: Record the Darwin host architecture
        run: uname -sm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare the pinned official library for this host
        run: bun run build:native
      - name: Verify Darwin path safety and native recovery from source
        run: |
          mkdir -p .test-results
          bun run test --parallel=1 test/domain/path-safety-cost.test.ts test/process/hawdb-native.test.ts --reporter=junit --reporter-outfile=.test-results/junit.xml
      - name: Preserve Darwin test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-diagnostics-darwin
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
