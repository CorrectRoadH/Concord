name: Check
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          cache: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
      - name: Prepare the pinned offline pytest adapter
        run: uv run --no-project --with pytest==9.1.1 pytest --version
      - uses: ./.github/actions/setup-native
        with:
          platform: ubuntu-24.04-linux-x64-glibc
      - name: Verify native transaction failure and crash recovery
        if: matrix.shard == 1
        run: |
          node --import tsx scripts/build-native.ts --output dist/native --test-hooks
          node --import tsx --test test/hawdb-native.test.ts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec vp exec playwright install --with-deps chromium
      - run: pnpm exec vp build && pnpm exec vp run typecheck:built
      - name: Run the complete suite across isolated serial shards
        run: CONCORD_TEST_CONCURRENCY=1 pnpm exec vp run test:built --test-shard=${{ matrix.shard }}/4
