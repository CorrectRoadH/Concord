name: Check
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ubuntu-24.04-linux-x64-glibc
      - name: Verify native transaction failure and crash recovery
        if: matrix.shard == 1
        run: |
          node --import tsx scripts/build-native.ts --output dist/native --test-hooks
          node --import tsx --test test/hawdb-native.test.ts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - name: Run the complete suite across isolated serial shards
        run: pnpm exec node --import tsx --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 test/*.test.ts
