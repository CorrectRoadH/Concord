name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'concord-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.os }}-${{ matrix.target }}
      - name: Verify native transaction failure and crash recovery
        run: |
          node --import tsx scripts/build-native.ts --output dist/native --test-hooks
          node --import tsx --test test/hawdb-native.test.ts
      - name: Build the pinned host engine
        run: node --import tsx scripts/build-native.ts --output native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: concord-hawdb-${{ matrix.target }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if test -z "$RELEASE_TAG"; then RELEASE_TAG="v$version"; fi
          if test "$RELEASE_TAG" != "v$version" && test "$RELEASE_TAG" != "concord-v$version"; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $version (expected v$version)."
            exit 1
          fi
          if test "$(node -p "require('./npm-shrinkwrap.json').version")" != "$version" ||
             test "$(node -p "require('./npm-shrinkwrap.json').packages[''].version")" != "$version"; then
            echo "::error::npm-shrinkwrap.json versions must match package version $version."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install public runtime helpers
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/download-artifact@v4
        with:
          pattern: concord-hawdb-*
          path: native-artifacts
          merge-multiple: true
      - run: pnpm typecheck
        env:
          CONCORD_NATIVE_ARTIFACTS: native-artifacts
          CONCORD_REQUIRE_PORTABLE_NATIVE: '1'
      - name: Pack once
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          test "$(find release -maxdepth 1 -type f -name 'concord-sdlc-*.tgz' | wc -l)" -eq 1
          sha256sum release/concord-sdlc-*.tgz > release/SHA256SUMS
      - name: Install and exercise the exact candidate package
        run: |
          sha256sum --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
          node --import tsx scripts/verify-installed-native.ts "$consumer/tool/node_modules/concord-sdlc"
      - uses: actions/upload-artifact@v4
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  tests:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Test a shard against the exact packed build
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          sha256sum --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          tar -xzf "release/concord-sdlc-$version.tgz" --strip-components=1 package/dist
          node --import tsx --test --test-shard="$TEST_SHARD/4" test/*.test.ts

  portable:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Verify portable locks and recovery from the packed build
        run: |
          shasum -a 256 --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          tar -xzf "release/concord-sdlc-$version.tgz" --strip-components=1 package/dist
          node --import tsx --test test/portable-coordination.test.ts test/storage.test.ts test/runtime-portability.test.ts test/coordination-migration.test.ts test/hawdb-native.test.ts test/hawdb-cache.test.ts test/content-cache.test.ts test/annotations.test.ts test/code-cache.test.ts test/feedback.test.ts
      - name: Install and exercise the same candidate CLI
        run: |
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d /private/tmp/concord-install.XXXXXXXX)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
          node --import tsx scripts/verify-installed-native.ts "$consumer/tool/node_modules/concord-sdlc"

  publish:
    needs: [package, tests, portable]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Publish the verified immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -z "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          version="${RELEASE_TAG#concord-}"
          version="${version#v}"
          digest="$(cut -d' ' -f1 release/SHA256SUMS)"
          gh release create "$RELEASE_TAG" "release/concord-sdlc-$version.tgz" "release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Concord $version" \
            --notes "Built and fully tested on Ubuntu 24.04. The same packed candidate, including pinned Linux x64 and macOS arm64 HawDB engines, passed cache, coordination, recovery, and isolated installation checks on Apple Silicon macOS 14 and 15. Consumer installation requires neither Rust nor a HawDB service. No old lock migration or mixed-version coordination is provided. Package SHA-256: $digest. Homebrew/Nix synchronization is owned by CorrectRoadH/homebrew-tap."
