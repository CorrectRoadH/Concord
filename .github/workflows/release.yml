name: Release

on:
  push:
    tags:
      - 'concord-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if test -z "$RELEASE_TAG"; then RELEASE_TAG="concord-v$version"; fi
          test "$RELEASE_TAG" = "concord-v$version"
          test "$(node -p "require('./npm-shrinkwrap.json').version")" = "$version"
          test "$(node -p "require('./npm-shrinkwrap.json').packages[''].version")" = "$version"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install public runtime helpers
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Pack once
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          test "$(find release -maxdepth 1 -type f -name 'concord-sdlc-*.tgz' | wc -l)" -eq 1
          sha256sum release/concord-sdlc-*.tgz > release/SHA256SUMS
      - name: Install and exercise the exact candidate package
        run: |
          sha256sum --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
      - uses: actions/upload-artifact@v4
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  portable:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Verify portable locks and recovery from the packed build
        run: |
          shasum -a 256 --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          tar -xzf "release/concord-sdlc-$version.tgz" --strip-components=1 package/dist
          node --import tsx --test test/portable-coordination.test.ts test/storage.test.ts test/runtime-portability.test.ts test/coordination-migration.test.ts
      - name: Install and exercise the same candidate CLI
        run: |
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d /private/tmp/concord-install.XXXXXXXX)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check

  publish:
    needs: [package, portable]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Publish the verified immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -z "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          version="${RELEASE_TAG#concord-v}"
          digest="$(cut -d' ' -f1 release/SHA256SUMS)"
          gh release create "$RELEASE_TAG" "release/concord-sdlc-$version.tgz" "release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Concord $version" \
            --notes "Built and fully tested on Ubuntu 24.04. The same packed candidate passed portable coordination, recovery, and isolated CLI installation checks on Apple Silicon macOS 14 and 15. Runtime publication no longer requires flock or disk-inspection helpers; SQLite remains disposable cache. No old lock migration or mixed-version coordination is provided. Package SHA-256: $digest. Homebrew/Nix synchronization is owned by CorrectRoadH/homebrew-tap."
