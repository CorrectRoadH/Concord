name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.os }}-${{ matrix.target }}
          deployment-target: ${{ matrix.target == 'darwin-arm64' && '15.0' || 'none' }}
      - name: Verify native ownership, clear and recovery on the target host
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/hawdb-hooks-cache"
          node scripts/build-native.ts --test-hooks
          bun test --no-env-file --config=/dev/null --timeout=300000 ./test/process/hawdb-native.test.ts
      - name: Build the pinned host engine
        run: node scripts/build-native.ts --output native-artifacts --require-portable
      - name: Sign Darwin native addon and official ripgrep
        if: matrix.target == 'darwin-arm64'
        run: node scripts/prepare-release-native.ts native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: concord-hawdb-${{ matrix.target }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record the checked out tag commit
        id: identity
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare package version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/prepare-release.ts
      - uses: actions/download-artifact@v4
        with:
          pattern: concord-hawdb-*
          path: native-artifacts
          merge-multiple: true
      - name: Typecheck maintained build scripts
        run: pnpm exec vp exec tsc -p tsconfig.scripts.json
      - name: Prepare Linux archive relocation tools
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils
      - name: Assemble both target archives and the library from one application build
        run: node scripts/assemble-release.ts release "$RUNNER_TEMP/concord-package" native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: package
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: '.bun-version'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Verify the exact candidate on its target host
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          archive=(release/concord-*-$RELEASE_TARGET.tar.gz)
          test "${#archive[@]}" -eq 1
          version="${archive[0]#release/concord-}"
          version="${version%-$RELEASE_TARGET.tar.gz}"
          node scripts/verify-release-archive.ts "${archive[0]}" "$version" release/SHA256SUMS

  publish:
    needs: [package, verify, gate]
    timeout-minutes: 3
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Publish the verified immutable asset
        id: source-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          version="${RELEASE_TAG#concord-}"
          version="${version#v}"
          cd release
          sha256sum --check SHA256SUMS
          expected=("concord-$version-linux-x64.tar.gz" "concord-$version-darwin-arm64.tar.gz" install.sh)
          test "$(wc -l < SHA256SUMS)" -eq 3
          for name in "${expected[@]}"; do
            test "$(awk -v name="$name" '$2 == name && length($1) == 64 { print $1 }' SHA256SUMS | wc -l)" -eq 1
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > ../existing-release.json 2> ../release-api-error; then
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" '.tag_name == $tag and .target_commitish == $commit and (.draft == false) and (.prerelease == false) and (.assets | length == 4)' ../existing-release.json
            for name in "${expected[@]}" SHA256SUMS; do
              digest="$(sha256sum "$name" | cut -d' ' -f1)"
              jq -e --arg name "$name" --arg digest "sha256:$digest" '.assets | any(.name == $name and .digest == $digest)' ../existing-release.json
            done
            echo "Existing release has the same immutable assets; continuing channel notification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q 'HTTP 404' ../release-api-error; then cat ../release-api-error >&2; exit 1; fi
          gh release create "$RELEASE_TAG" "${expected[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" --title "Concord $version" \
            --notes "Self-contained Apple Silicon macOS 15+ and Linux x64/glibc 2.39+ archives. Exact candidate bytes verified on Ubuntu 24.04 and macOS 15; the same tag commit passed the repository gate. Channel synchronization: https://github.com/CorrectRoadH/homebrew-tap/actions/workflows/concord-release-sync.yml . Completion receipt: https://github.com/CorrectRoadH/homebrew-tap/releases/tag/$RELEASE_TAG ."
      - name: Notify Homebrew tap of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_WORKFLOW_TOKEN: ${{ secrets.HOMEBREW_TAP_WORKFLOW_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo CorrectRoadH/homebrew-tap >/dev/null 2>&1; then
            echo "Homebrew/Nix channel completion receipt already exists for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if test -z "$TAP_WORKFLOW_TOKEN"; then
            echo '::error::HOMEBREW_TAP_WORKFLOW_TOKEN is not configured; source release exists but channel synchronization is incomplete'
            echo "Configure a tap-scoped Actions write token, or run: gh workflow run concord-release-sync.yml --repo CorrectRoadH/homebrew-tap --ref main --field tag=$RELEASE_TAG. After the channel receipt exists, rerun this failed job." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for delay in 0 2 5; do
            if test "$delay" -gt 0; then sleep "$delay"; fi
            if GH_TOKEN="$TAP_WORKFLOW_TOKEN" gh workflow run concord-release-sync.yml \
              --repo CorrectRoadH/homebrew-tap --ref main --field "tag=$RELEASE_TAG"; then
              echo "Homebrew tap sync requested for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::Homebrew tap notification failed for $RELEASE_TAG"
          echo "Homebrew tap notification failed for $RELEASE_TAG; scheduled sync remains available." >> "$GITHUB_STEP_SUMMARY"
          exit 1
