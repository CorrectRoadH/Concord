name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.os }}-${{ matrix.target }}
          deployment-target: ${{ matrix.target == 'darwin-arm64' && '15.0' || 'none' }}
      - name: Verify native ownership, clear and recovery on the target host
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/hawdb-hooks-cache"
          node scripts/build-native.ts --test-hooks
          node --test test/process/hawdb-native.test.ts
      - name: Build the pinned host engine
        run: node scripts/build-native.ts --output native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: concord-hawdb-${{ matrix.target }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare package version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/prepare-release.ts
      - uses: actions/download-artifact@v4
        with:
          pattern: concord-hawdb-*
          path: native-artifacts
          merge-multiple: true
      - name: Build and typecheck maintained build scripts
        run: pnpm exec vp build --outDir "$RUNNER_TEMP/concord-package" && pnpm exec vp exec tsc -p tsconfig.scripts.json
        env:
          CONCORD_NATIVE_ARTIFACTS: native-artifacts
          CONCORD_REQUIRE_PORTABLE_NATIVE: '1'
      - name: Pack once
        run: |
          mkdir release
          node scripts/release-package.ts release "$RUNNER_TEMP/concord-package"
          test "$(find release -maxdepth 1 -type f -name 'concord-sdlc-*.tgz' | wc -l)" -eq 1
          cp install.sh release/install.sh
          sha256sum release/concord-sdlc-*.tgz release/install.sh > release/SHA256SUMS
      - name: Verify frozen production installation from the final archive
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          candidate="$(mktemp -d)"
          trap 'rm -rf "$candidate"' EXIT
          tar -xzf release/concord-sdlc-*.tgz -C "$candidate"
          (cd "$candidate/package" && pnpm install --prod --frozen-lockfile --ignore-scripts)
          for name in package.json pnpm-lock.yaml pnpm-workspace.yaml; do cmp "$name" "$candidate/package/$name"; done
          node scripts/verify-installed-native.ts "$candidate/package"
      - uses: actions/upload-artifact@v4
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [package, gate]
    outputs:
      source-published: ${{ steps.source-release.outcome == 'success' }}
    timeout-minutes: 3
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Publish the verified immutable asset
        id: source-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#concord-}"
          version="${version#v}"
          digest="$(awk -v name="release/concord-sdlc-$version.tgz" '$2 == name { print $1 }' release/SHA256SUMS)"
          installer_digest="$(awk '$2 == "release/install.sh" { print $1 }' release/SHA256SUMS)"
          test -n "$digest" && test -n "$installer_digest"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > existing-release.json 2>/dev/null; then
            jq -e --arg name "concord-sdlc-$version.tgz" --arg digest "sha256:$digest" '.assets | any(.name == $name and .digest == $digest)' existing-release.json
            jq -e --arg digest "sha256:$installer_digest" '.assets | any(.name == "install.sh" and .digest == $digest) and any(.name == "SHA256SUMS")' existing-release.json
            echo "Existing release has the same immutable package; continuing channel notification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$RELEASE_TAG" "release/concord-sdlc-$version.tgz" "release/SHA256SUMS" "release/install.sh" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Concord $version" \
            --notes "Apple Silicon macOS 15+ (including macOS 27) and Linux x64/glibc. Built once with pinned native engines; package metadata and SHA-256 verified. The same tag commit passed the repository checks. macOS 27 is not directly covered by CI. Homebrew/Nix metadata synchronization is tracked at https://github.com/CorrectRoadH/homebrew-tap/actions/workflows/concord-release-sync.yml . Channel completion receipt: https://github.com/CorrectRoadH/homebrew-tap/releases/tag/$RELEASE_TAG . Package SHA-256: $digest."
      - name: Notify Homebrew tap of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_WORKFLOW_TOKEN: ${{ secrets.HOMEBREW_TAP_WORKFLOW_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo CorrectRoadH/homebrew-tap >/dev/null 2>&1; then
            echo "Homebrew/Nix channel completion receipt already exists for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if test -z "$TAP_WORKFLOW_TOKEN"; then
            echo '::error::HOMEBREW_TAP_WORKFLOW_TOKEN is not configured; source release exists but channel synchronization is incomplete'
            echo "Configure a tap-scoped Actions write token, or run: gh workflow run concord-release-sync.yml --repo CorrectRoadH/homebrew-tap --ref main --field tag=$RELEASE_TAG. After the channel receipt exists, rerun this failed job." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for delay in 0 2 5; do
            if test "$delay" -gt 0; then sleep "$delay"; fi
            if GH_TOKEN="$TAP_WORKFLOW_TOKEN" gh workflow run concord-release-sync.yml \
              --repo CorrectRoadH/homebrew-tap --ref main --field "tag=$RELEASE_TAG"; then
              echo "Homebrew tap sync requested for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::Homebrew tap notification failed for $RELEASE_TAG"
          echo "Homebrew tap notification failed for $RELEASE_TAG; scheduled sync remains available." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  herdr-mod:
    needs: publish
    if: ${{ always() && inputs.tag != '' && needs.publish.outputs.source-published == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Generate Herdr mirror from the verified release package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          sha256sum --check release/SHA256SUMS
          mkdir -p "$RUNNER_TEMP/herdr-package" "$RUNNER_TEMP/herdr-mirror"
          tar -xzf release/concord-sdlc-*.tgz -C "$RUNNER_TEMP/herdr-package"
          node scripts/herdr-mod-release.ts "$RUNNER_TEMP/herdr-package/package" "$RUNNER_TEMP/herdr-mirror" "$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ github.token }}
          path: herdr-mirror
      - name: Synchronize the generated Concord directory
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          rm -rf herdr-mirror/concord
          cp -R "$RUNNER_TEMP/herdr-mirror/concord" herdr-mirror/concord
          git -C herdr-mirror add -- concord
          if git -C herdr-mirror diff --cached --quiet; then
            echo "Herdr mod mirror already matches $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C herdr-mirror -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Concord Herdr mod $RELEASE_TAG" -- concord
          git -C herdr-mirror push origin HEAD:master
          echo "Herdr mod $RELEASE_TAG synchronized to $GITHUB_REPOSITORY/concord on master." >> "$GITHUB_STEP_SUMMARY"
