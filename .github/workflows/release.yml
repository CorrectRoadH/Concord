name: Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}

  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native ownership, clear and recovery on the target host
        run: |
          bun scripts/prepare-native.ts --test-hooks
          CONCORD_NATIVE_TEST_HOOKS=1 bun test --no-env-file --config=/dev/null --timeout=300000 ./test/process/hawdb-native.test.ts
      - name: Download the pinned host engine
        run: bun scripts/prepare-native.ts --output native-artifacts --require-portable
      - name: Verify Darwin native signature and sign official ripgrep
        if: matrix.target == 'darwin-arm64'
        run: bun scripts/prepare-release-native.ts native-artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: concord-hawdb-${{ matrix.target }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 7

  candidate:
    needs: native
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            native: linux-x64-glibc
          - os: macos-15
            target: darwin-arm64
            native: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Record the checked out tag commit
        id: identity
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare package version from release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun --no-env-file --config=/dev/null scripts/prepare-release.ts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: concord-hawdb-${{ matrix.native }}
          path: native-artifacts
      - name: Typecheck maintained build scripts
        run: bun node_modules/typescript/bin/tsc -p tsconfig.scripts.json
      - name: Prepare Linux archive relocation tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf binutils
      - name: Compile and assemble the target candidate
        env:
          CONCORD_TARGET: ${{ matrix.target }}
        run: bun scripts/assemble-release.ts candidate candidate "$RUNNER_TEMP/concord-package" native-artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: concord-candidate-${{ matrix.target }}
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: candidate
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: '.bun-version'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Record the checked out tag commit
        id: identity
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: concord-candidate-*
          path: candidates
      - name: Collect the exact target candidates
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: bun scripts/assemble-release.ts collect release candidates/concord-candidate-linux-x64 candidates/concord-candidate-darwin-arm64
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [package, tests]
    timeout-minutes: 3
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: concord-release-package
          path: release
      - name: Publish the built immutable asset
        id: source-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          version="${RELEASE_TAG#concord-}"
          version="${version#v}"
          cd release
          sha256sum --check SHA256SUMS
          expected=("concord-$version-linux-x64.tar.gz" "concord-$version-darwin-arm64.tar.gz" install.sh)
          test "$(wc -l < SHA256SUMS)" -eq 3
          for name in "${expected[@]}"; do
            test "$(awk -v name="$name" '$2 == name && length($1) == 64 { print $1 }' SHA256SUMS | wc -l)" -eq 1
          done
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > ../existing-release.json 2> ../release-api-error; then
            jq -e --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" '.tag_name == $tag and .target_commitish == $commit and (.draft == false) and (.prerelease == false) and (.assets | length == 4)' ../existing-release.json
            for name in "${expected[@]}" SHA256SUMS; do
              digest="$(sha256sum "$name" | cut -d' ' -f1)"
              jq -e --arg name "$name" --arg digest "sha256:$digest" '.assets | any(.name == $name and .digest == $digest)' ../existing-release.json
            done
            echo "Existing release has the same immutable assets; continuing channel notification." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! grep -q 'HTTP 404' ../release-api-error; then cat ../release-api-error >&2; exit 1; fi
          gh release create "$RELEASE_TAG" "${expected[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_COMMIT" --title "Concord $version" \
            --notes "Self-contained Apple Silicon macOS 15+ and Linux x64/glibc 2.39+ archives. Archives built on Ubuntu 24.04 and macOS 15; the same tag commit passed repository tests and static checks. Channel synchronization: https://github.com/CorrectRoadH/homebrew-tap/actions/workflows/concord-release-sync.yml . Completion receipt: https://github.com/CorrectRoadH/homebrew-tap/releases/tag/$RELEASE_TAG ."
      - name: Notify Homebrew tap of the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_WORKFLOW_TOKEN: ${{ secrets.HOMEBREW_TAP_WORKFLOW_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo CorrectRoadH/homebrew-tap >/dev/null 2>&1; then
            echo "Homebrew/Nix channel completion receipt already exists for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if test -z "$TAP_WORKFLOW_TOKEN"; then
            echo '::error::HOMEBREW_TAP_WORKFLOW_TOKEN is not configured; source release exists but channel synchronization is incomplete'
            echo "Configure a tap-scoped Actions write token, or run: gh workflow run concord-release-sync.yml --repo CorrectRoadH/homebrew-tap --ref main --field tag=$RELEASE_TAG. After the channel receipt exists, rerun this failed job." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for delay in 0 2 5; do
            if test "$delay" -gt 0; then sleep "$delay"; fi
            if GH_TOKEN="$TAP_WORKFLOW_TOKEN" gh workflow run concord-release-sync.yml \
              --repo CorrectRoadH/homebrew-tap --ref main --field "tag=$RELEASE_TAG"; then
              echo "Homebrew tap sync requested for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::Homebrew tap notification failed for $RELEASE_TAG"
          echo "Homebrew tap notification failed for $RELEASE_TAG; scheduled sync remains available." >> "$GITHUB_STEP_SUMMARY"
          exit 1
