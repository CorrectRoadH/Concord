name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'concord-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish; leave empty for validation only
        required: false
        type: string

concurrency:
  group: concord-release
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64-glibc
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.os }}-${{ matrix.target }}
      - name: Verify native transaction failure and crash recovery
        run: |
          node --import tsx scripts/build-native.ts --output dist/native --test-hooks
          node --import tsx --test test/hawdb-native.test.ts
      - name: Build the pinned host engine
        run: node --import tsx scripts/build-native.ts --output native-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: concord-hawdb-${{ matrix.target }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare package version from release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node --import tsx scripts/prepare-release.ts
      - name: Install public runtime helpers
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/download-artifact@v4
        with:
          pattern: concord-hawdb-*
          path: native-artifacts
          merge-multiple: true
      - run: pnpm typecheck
        env:
          CONCORD_NATIVE_ARTIFACTS: native-artifacts
          CONCORD_REQUIRE_PORTABLE_NATIVE: '1'
      - name: Pack once
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          test "$(find release -maxdepth 1 -type f -name 'concord-sdlc-*.tgz' | wc -l)" -eq 1
          sha256sum release/concord-sdlc-*.tgz > release/SHA256SUMS
      - name: Install and exercise the exact candidate package
        run: |
          sha256sum --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
          node --import tsx scripts/verify-installed-native.ts "$consumer/tool/node_modules/concord-sdlc"
      - uses: actions/upload-artifact@v4
        with:
          name: concord-release-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  tests:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare test checkout version from release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node --import tsx scripts/prepare-release.ts
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Test a shard against the exact packed build
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          sha256sum --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          tar -xzf "release/concord-sdlc-$version.tgz" --strip-components=1 package/dist
          node --import tsx --test --test-shard="$TEST_SHARD/4" test/*.test.ts

  portable:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            full: true
          - os: macos-15
            full: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
        if: matrix.full
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: pnpm/action-setup@v4
        if: matrix.full
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        if: matrix.full
        with:
          node-version: '24.19.0'
          cache: pnpm
      - uses: actions/setup-node@v4
        if: ${{ !matrix.full }}
        with:
          node-version: '24.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: matrix.full
      - name: Prepare test checkout version from release tag
        if: matrix.full
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: node --import tsx scripts/prepare-release.ts
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Verify portable locks and recovery from the packed build
        if: matrix.full
        run: |
          shasum -a 256 --check release/SHA256SUMS
          version="$(node -p "require('./package.json').version")"
          tar -xzf "release/concord-sdlc-$version.tgz" --strip-components=1 package/dist
          node --import tsx --test test/portable-coordination.test.ts test/storage.test.ts test/runtime-portability.test.ts test/coordination-migration.test.ts test/hawdb-native.test.ts test/hawdb-cache.test.ts test/content-cache.test.ts test/annotations.test.ts test/code-cache.test.ts test/feedback.test.ts
      - name: Install and exercise the same candidate CLI
        if: matrix.full
        run: |
          version="$(node -p "require('./package.json').version")"
          consumer="$(mktemp -d /private/tmp/concord-install.XXXXXXXX)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/release/concord-sdlc-$version.tgz"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$($cli --version)" = "concord v$version"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
          node --import tsx scripts/verify-installed-native.ts "$consumer/tool/node_modules/concord-sdlc"
      - name: Verify macOS Homebrew preserves the native artifact
        if: matrix.full
        run: |
          version="$(node -p "require('./package.json').version")"
          package="$PWD/release/concord-sdlc-$version.tgz"
          digest="$(shasum -a 256 "$package" | cut -d' ' -f1)"
          brew tap-new concord/validation
          formula="$(brew --repository concord/validation)/Formula/concord.rb"
          cat > "$formula" <<RUBY
          class Concord < Formula
            desc "Concord release installation verification"
            homepage "https://github.com/CorrectRoadH/Concord"
            url "file://$package"
            version "$version"
            sha256 "$digest"
            depends_on "node"
            preserve_rpath
            def install
              system "npm", "install", *std_npm_args, "--ignore-scripts"
              (libexec/"lib/node_modules/concord-sdlc/dist/native").glob("*/hawdb.node").each do |binary|
                system "gzip", "-n", binary
              end
              (bin/"concord").write_env_script libexec/"bin/concord", PATH: "#{Formula["node"].opt_bin}:\$PATH"
            end
            def post_install
              (libexec/"lib/node_modules/concord-sdlc/dist/native").glob("*/hawdb.node.gz").each do |binary|
                system "gunzip", binary
              end
            end
          end
          RUBY
          HOMEBREW_NO_AUTO_UPDATE=1 brew install concord/validation/concord
          installed="$(brew --prefix concord/validation/concord)/libexec/lib/node_modules/concord-sdlc"
          shasum -a 256 "$installed/dist/native/darwin-arm64/hawdb.node"
          node --import tsx scripts/verify-installed-native.ts "$installed"
      - name: Smoke test the same package on macOS 15
        if: ${{ !matrix.full }}
        run: |
          shasum -a 256 --check release/SHA256SUMS
          tgz="$(find release -maxdepth 1 -type f -name 'concord-sdlc-*.tgz' -print -quit)"
          test -n "$tgz"
          version="$(tar -xOf "$tgz" package/package.json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).version))')"
          consumer="$(mktemp -d /private/tmp/concord-install.XXXXXXXX)"
          git -C "$consumer" init --quiet
          npm install --prefix "$consumer/tool" --ignore-scripts --no-audit --no-fund "$PWD/$tgz"
          installed="$consumer/tool/node_modules/concord-sdlc"
          cli="$consumer/tool/node_modules/.bin/concord"
          test "$("$cli" --version)" = "concord v$version"
          node --input-type=module -e 'const { hawdbIdentity } = await import(process.argv[1]); if (hawdbIdentity().target !== "darwin-arm64") process.exit(1)' "$installed/dist/hawdb-native.js"
          "$cli" --root "$consumer" init --docs-only
          "$cli" --root "$consumer" check
          "$cli" --root "$consumer" --json test list >/dev/null
          "$cli" --root "$consumer" --json test list | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => { if (JSON.parse(data).cache.status !== "hit") process.exit(1); })'

  publish:
    needs: [package, tests, portable]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: concord-release-package
          path: release
      - name: Publish the verified immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          test -z "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          version="${RELEASE_TAG#concord-}"
          version="${version#v}"
          digest="$(cut -d' ' -f1 release/SHA256SUMS)"
          gh release create "$RELEASE_TAG" "release/concord-sdlc-$version.tgz" "release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Concord $version" \
            --notes "Built and fully tested on Ubuntu 24.04. The same packed candidate, including pinned Linux x64 and macOS arm64 HawDB engines, passed cache, coordination, recovery, and isolated installation checks on Apple Silicon macOS 14. macOS 15 passed installed CLI, native loading, and cache smoke checks. Consumer installation requires neither Rust nor a HawDB service. No old lock migration or mixed-version coordination is provided. Package SHA-256: $digest. Homebrew/Nix synchronization is owned by CorrectRoadH/homebrew-tap."
      - name: Notify Homebrew tap of the published release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_WORKFLOW_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if test -z "$GH_TOKEN"; then
            echo '::warning::Homebrew tap notification skipped: HOMEBREW_TAP_WORKFLOW_TOKEN is not configured'
            echo 'Homebrew tap notification skipped; scheduled sync remains available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for delay in 0 2 5; do
            if test "$delay" -gt 0; then sleep "$delay"; fi
            if gh workflow run concord-release-sync.yml \
              --repo CorrectRoadH/homebrew-tap --ref main --field "tag=$RELEASE_TAG"; then
              echo "Homebrew tap sync requested for $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Homebrew tap notification failed for $RELEASE_TAG; scheduled sync remains available"
          echo "Homebrew tap notification failed for $RELEASE_TAG; scheduled sync remains available." >> "$GITHUB_STEP_SUMMARY"
