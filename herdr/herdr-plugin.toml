# Bound to the installing Concord package by its postinstall entry.
id = "concord"
name = "Concord Spec"
version = "1.0.0"
description = "Read this worktree's Spec beside the current terminal."
min_herdr_version = "0.7.3"
platforms = ["linux", "macos"]

[[actions]]
id = "open-spec"
title = "Concord: open Spec"
contexts = ["workspace"]
command = ["__NODE_EXECUTABLE__", "__CONCORD_PANEL_ACTION__"]

[[panes]]
id = "spec"
title = "Concord Spec"
placement = "split"
command = ["__CONCORD_ENTRY__", "panel"]
